<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Lift Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" crossorigin src="/Lifting-Log/assets/index-dOSybVYn.js"></script>
  <link rel="stylesheet" crossorigin href="/Lifting-Log/assets/index-CFJPko1u.css">
</head>

<body>
  <!-- AUTH CONTAINER -->
  <div id="auth-container" class="card">
    <h1 id="auth-title">Login</h1>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required />
      <input type="password" id="auth-password" placeholder="Password" required />
      <button type="submit" id="auth-submit">Login</button>
    </form>
    <p id="auth-switch-text">
      Don't have an account? <span id="auth-switch-btn" class="link-btn">Sign Up</span>
    </p>
  </div>

  <!-- MAIN APP CONTAINER (Initially Hidden) -->
  <div id="app-container" class="hidden">
    <!-- FIXED HEADER -->
    <header class="app-header">
      <h1>Lifting Tracker</h1>
    </header>

    <!-- SCROLLABLE PAGE CONTENT -->
    <main class="page-content">

      <!-- PAGE: LOG ENTRY -->
      <div id="view-log" class="page-view">
        <form id="log-form">
          <!-- Date defaults to today -->
          <input id="date" type="date" required />

          <!-- Exercise dropdown + "Add New" -->
          <div class="exercise-row">
            <select id="exercise" required></select>
            <button type="button" id="add-exercise">＋ Add Exercise</button>
          </div>

          <input id="weight" type="float" placeholder="Weight (kg)" required />
          <input id="reps" type="number" placeholder="Reps" required />
          <input id="note" type="text" placeholder="Note (optional)" />

          <div class="form-actions">
            <button type="submit" id="add-entry">Add Entry</button>
            <button type="button" id="cancel-edit" class="hidden" style="background-color: #94a3b8;">Cancel</button>
          </div>
        </form>
      </div>

      <!-- PAGE: HISTORY & ANALYTICS -->
      <div id="view-analytics" class="page-view hidden">
        <!-- Stats Card -->
        <div class="stats-card">
          <h3>Last Workout</h3>
          <p id="last-workout-text">No data yet</p>
        </div>

        <!-- Chart Section -->
        <div class="chart-section">
          <h3>Progress Chart</h3>
          <select id="chart-exercise-select"></select>
          <div class="chart-container">
            <canvas id="progress-chart"></canvas>
          </div>
        </div>

        <!-- History Table -->
        <h3>History</h3>
        <button id="export-csv">Export to CSV</button>

        <div class="table-container">
          <table id="log-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Exercise</th>
                <th>Weight</th>
                <th>Reps</th>
                <th>Note</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- PAGE: SETTINGS -->
      <div id="view-settings" class="page-view hidden">
        <div class="settings-section">
          <h2>Settings</h2>

          <div class="settings-card">
            <button id="tip-btn" class="tip-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
              </svg>
              Tip Me
            </button>
          </div>

          <div class="settings-card settings-card-danger">
            <button id="settings-logout-btn" class="logout-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Log Out
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="view-log">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        <span>Log Entry</span>
      </button>
      <button class="nav-item" data-page="view-analytics">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <span>History</span>
      </button>
      <button class="nav-item" data-page="view-settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
