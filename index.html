<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Lift Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" crossorigin src="/Lifting-Log/assets/index-BLAT4VKb.js"></script>
  <link rel="stylesheet" crossorigin href="/Lifting-Log/assets/index-CwYNH-oa.css">
</head>

<body>
  <div class="card">
    <h1>My Lift Log</h1>

    <form id="log-form">
      <!-- Date defaults to today -->
      <input id="date" type="date" required />

      <!-- Exercise dropdown + “Add New” -->
      <div class="exercise-row">
        <select id="exercise" required></select>
        <button type="button" id="add-exercise">＋ Add Exercise</button>
      </div>

      <input id="weight" type="number" placeholder="Weight (kg)" required />
      <input id="reps" type="number" placeholder="Reps" required />
      <input id="note" type="text" placeholder="Note (optional)" />

      <button type="submit" id="add-entry">Add Entry</button>
    </form>

    <button id="export-csv">Export to CSV</button>
    <button id="tip-btn" class="tip-btn">💖 Tip Me</button>

    <div class="table-container">
      <table id="log-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Exercise</th>
            <th>Weight</th>
            <th>Reps</th>
            <th>Note</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <button id="clear-all">Clear All</button>
  </div>

</body>

</html>
